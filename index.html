:root{--bg:#eef1f6;--bg2:#fff;--tx:#0b1730;--mut:#5a6580;--red:#ef0107;--rt:#d40006;--navy:#063672;--gold:#c8a24a;--line:#0b17301f;--ok:#16a34a;--bad:#dc2626;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1428;--bg2:#111d37;--tx:#eef2fb;--mut:#93a0bf;--rt:#ff6a6f;--line:#ffffff24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1428;--bg2:#111d37;--tx:#eef2fb;--mut:#93a0bf;--rt:#ff6a6f;--line:#ffffff24;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.6 TS,Cairo,system-ui,Tahoma,sans-serif;max-width:560px;margin-inline:auto;padding:0 14px 120px}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3,summary,.dp{font-family:TD,TS,sans-serif;font-weight:400}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0 12px}
h1{margin:0;font-size:38px;line-height:1;color:var(--red)}
header p{margin:2px 0 0;font-size:13px;color:var(--mut)}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--bg2);color:var(--tx);font-size:18px;cursor:pointer}
.sb{background:#060d1c;color:#fff;border-radius:10px;padding:12px 16px;box-shadow:inset 0 0 0 3px #060d1c,inset 0 0 0 4px #ffffff22}
.sbt{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sb small{display:block;font-size:11px;color:#9fb0d4;line-height:1.3}
.sbn b{display:block;font:400 68px/1 TD,TS,sans-serif;color:#ff3b40;text-shadow:0 0 18px #ef0107aa;direction:ltr;text-align:right}
.sbr{display:grid;grid-template-columns:repeat(2,auto);gap:6px 18px;text-align:center}
.sbr b{display:block;font:400 24px/1.1 TD,sans-serif;direction:ltr}
.sbf{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;padding-top:9px;border-top:1px solid #ffffff22;font-size:12px;color:#9fb0d4}
.form{display:flex;gap:5px}
.dot{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font:700 12px TS;color:#fff;font-style:normal}
.pitch{position:relative;margin-top:14px;border-radius:18px;padding:24px 4px;display:flex;flex-direction:column;gap:26px;overflow:hidden;background:repeating-linear-gradient(0deg,#1f7a35 0 56px,#258a3d 56px 112px);border:2px solid #ffffff66;box-shadow:inset 0 0 60px #0007}
.pitch i.l{position:absolute;border:2px solid #ffffff70;pointer-events:none}
.l.h{left:0;right:0;top:50%;border-width:2px 0 0}
.l.c{width:84px;height:84px;border-radius:50%;left:calc(50% - 42px);top:calc(50% - 42px)}
.l.b1,.l.b2{width:54%;height:56px;left:23%}
.l.b1{top:0;border-top:0}.l.b2{bottom:0;border-bottom:0}
.row{display:flex;justify-content:space-evenly;position:relative;z-index:1}
.bench{margin-top:12px;border-radius:18px;padding:12px 4px 14px;background:linear-gradient(180deg,#0e1a36,#050a16);box-shadow:inset 0 0 0 1px #ffffff22}.bench h3{margin:0 0 10px;text-align:center;font:700 13px TS;color:#ffffffb0;letter-spacing:.5px}
.pl{background:none;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;gap:3px;width:92px;cursor:pointer;position:relative;transition:transform .2s}
.pl:active{transform:scale(.93)}
.kit{width:52px;height:52px;border-radius:16px 16px 24px 24px;background:#ef0107;border:3px solid #fff;display:grid;place-items:center;font:400 24px/1 TD,sans-serif;box-shadow:0 6px 14px #0008;transition:transform .2s}
.pl:hover .kit{transform:translateY(-3px)}
.pl b{font-size:12px;line-height:1.25;text-shadow:0 1px 4px #000}
.pl i{font-style:normal;background:#fff;color:#111;font-size:11px;font-weight:900;padding:0 9px;border-radius:99px}
.pl u{position:absolute;top:-6px;right:14px;background:var(--gold);color:#000;width:21px;height:21px;border-radius:50%;font:900 12px/21px TS;text-decoration:none;box-shadow:0 2px 6px #0009}
.pl em{position:absolute;top:-7px;left:14px;font-style:normal;font-size:15px;filter:drop-shadow(0 1px 2px #000)}
.in .pl{animation:drop .6s cubic-bezier(.2,.9,.3,1.25) backwards}
@keyframes drop{from{opacity:0;transform:translateY(-46px) scale(.7)}}
.hint{font-size:12px;color:var(--mut);text-align:center;margin:8px 0;line-height:1.7}
.sec{margin:26px 0}
.sec>h3,summary{margin:0 0 6px;font-size:22px;padding-bottom:6px;border-bottom:1px solid var(--line)}
summary{cursor:pointer}
.m,.rk{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.rk{cursor:pointer}
.m .r{width:30px;height:30px;border-radius:9px;color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px;flex:none}
.m .t{flex:1;font-weight:700;line-height:1.35}
.m .t small,.rk small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.m .sc{font:400 22px TD,sans-serif;direction:ltr}
.m button{background:none;border:0;font-size:17px;cursor:pointer;opacity:.7}
.rk .n{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font:400 15px TD,sans-serif;flex:none}
.rk:nth-child(2) .n{background:var(--gold);color:#000}
.rk .nm{flex:1;font-weight:700}
.rk .st{display:flex;gap:12px;color:var(--mut);font-weight:400;font-size:12px}
.rk .bar{height:5px;border-radius:5px;background:var(--line);margin-top:6px;overflow:hidden}
.rk .bar i{display:block;height:100%;background:var(--red);border-radius:5px;animation:gw .8s}
@keyframes gw{from{width:0}}
.rk .p{font:400 28px TD,sans-serif;color:var(--rt);min-width:34px;text-align:left}
.pod{display:flex;align-items:flex-end;gap:8px;direction:ltr;margin-top:12px}
.pc{flex:1;text-align:center;cursor:pointer;font-size:13px;font-weight:700}
.pc .md{font-size:26px}
.pb{border-radius:12px 12px 0 0;display:grid;place-items:start center;padding-top:8px;font:400 30px TD,sans-serif;color:#fff;animation:gh .7s;transform-origin:bottom}
@keyframes gh{from{transform:scaleY(0)}}
.pc:nth-child(1) .pb{background:#7d8aa6}.pc:nth-child(2) .pb{background:var(--gold)}.pc:nth-child(3) .pb{background:#b06a2c}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:15px}.stat span{font-size:12px;color:var(--mut)}
.bars{display:flex;align-items:flex-end;gap:6px;height:116px;overflow-x:auto;margin-top:8px}
.bc{flex:1;min-width:30px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;font:700 11px TS}
.bc i{width:100%;border-radius:6px 6px 2px 2px;background:var(--red);animation:gh .6s;transform-origin:bottom}
.bc small{color:var(--mut);font-weight:400}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px;font-weight:700}
input,select,textarea{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--tx);font:inherit}
textarea{resize:vertical;font-size:13px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tot{display:flex;justify-content:space-between;align-items:center;border:1px dashed var(--red);border-radius:12px;padding:8px 14px;margin-top:12px;font-weight:700}
.tot b{font:400 30px TD,sans-serif;color:var(--rt)}
.pr{border:1px solid var(--line);border-radius:14px;padding:10px;margin:8px 0;background:var(--bg2)}
.pr.off{opacity:.55}
.ph{display:flex;align-items:center;gap:8px}
.ph b{flex:1;font-size:15px}.ph small{color:var(--mut);font-weight:400;font-size:12px;margin-inline-start:6px}
.pv{font:400 22px TD,sans-serif;color:var(--rt);direction:ltr;min-width:44px;text-align:center}
.tg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.stp{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:99px;padding:3px;border:1px solid var(--line)}
.stp button{width:30px;height:30px;border:0;border-radius:50%;background:var(--red);color:#fff;font:900 18px TS;cursor:pointer}
.stp span{min-width:34px;text-align:center;font-weight:700}
.chip,.sw{border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:99px;padding:6px 12px;font:700 13px TS;cursor:pointer}
.chip.on{background:var(--red);color:#fff;border-color:var(--red)}
.sw.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--red);color:#fff;font:900 16px TS;cursor:pointer;margin-top:12px;transition:transform .15s}
.btn:active{transform:scale(.97)}.btn.sec2{background:var(--navy)}.btn.bad{background:#991b1b}
.empty{text-align:center;color:var(--mut);padding:16px 8px;line-height:1.9}
.rules span{display:inline-block;background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:1px 12px;margin:4px 0 0 6px;font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));pointer-events:none}
nav div{pointer-events:auto;display:flex;gap:4px;width:100%;max-width:520px;background:var(--bg2);border:1px solid var(--line);border-radius:24px;padding:5px;box-shadow:0 10px 30px #0005}
nav button{flex:1;border:0;background:none;color:var(--mut);border-radius:19px;padding:6px 2px;font:700 12px TS;cursor:pointer;display:flex;flex-direction:column;align-items:center}
nav button span{font-size:20px;line-height:1.3}
nav button.on{background:var(--red);color:#fff}
#ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:40}
#ov.on{display:flex}
#box{background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:16px;width:100%;max-width:400px;max-height:100%;overflow:auto;text-align:center;animation:pop .25s}
@keyframes pop{from{transform:scale(.9);opacity:0}}
#box h2{margin:0;font-size:24px}
.fifa{position:relative;overflow:hidden;background:var(--navy);border:2px solid var(--gold);border-radius:18px 18px 44px 44px;padding:16px 10px 22px;color:#fff;margin-bottom:12px}
.fifa .bn{position:absolute;inset:auto auto -22px 10px;font:400 120px/1 TD,sans-serif;color:#ffffff14}
.fifa .rt{font:400 60px/1 TD,sans-serif;color:var(--gold)}
.fifa small{display:block;font-size:13px;color:#c9d4ee}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sg div{background:var(--bg);border-radius:10px;padding:7px 2px}.sg b{display:block;font:400 20px TD,sans-serif}.sg span{font-size:11px;color:var(--mut)}
.mh{margin:14px 0 0;font-size:18px}
#tst{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:60;max-width:90%;text-align:center}
#tst.on{opacity:1;transform:translate(-50%,0)}
#cv{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:70}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
const $=id=>document.getElementById(id);
const liteMode=matchMedia('(prefers-reduced-motion: reduce)').matches || !!(navigator.connection&&navigator.connection.saveData);
const P=[{id:1,n:'عبدالرحمن الشلاوي',pos:'GK'},{id:2,n:'سفيان',pos:'DEF'},{id:3,n:'صلاح',pos:'MID'},{id:4,n:'أحمد تامر',pos:'MID'},{id:5,n:'أحمد أمير',pos:'FWD'},{id:6,n:'دسوقي',pos:'FWD'},{id:7,n:'محمد عمرو',pos:'FWD'}];
const PL={GK:'حارس',DEF:'مدافع',MID:'وسط',FWD:'مهاجم'};
const G={GK:6,DEF:6,MID:5,FWD:4},CS={GK:4,DEF:4,MID:1,FWD:0};
const KEY='arsenal-fantasy-v1',TK='arsenal-theme';
let st={matches:[],cap:null},tab='team',first=1,F,D;
try{const s=localStorage.getItem(KEY);if(s)st=JSON.parse(s)}catch(e){}
if(!st||!Array.isArray(st.matches))st={matches:[],cap:null};st.nums=st.nums||{};st.tour=st.tour||null;
const LEGACY_CLUB_NAME='أرسنال',CURRENT_CLUB_NAME='الأهلي السعودي';
function migrateClubName(){let changed=false;const rename=n=>{if(n===LEGACY_CLUB_NAME){changed=true;return CURRENT_CLUB_NAME}return n};
 if(st.tour){const t=st.tour;if(Array.isArray(t.groups))t.groups=t.groups.map(g=>Array.isArray(g)?g.map(rename):g);if(Array.isArray(t.tm))t.tm=t.tm.map(rename);if(Array.isArray(t.koQualifiers))t.koQualifiers=t.koQualifiers.map(rename);
  ['badges','manualPts'].forEach(k=>{const o=t[k];if(o&&Object.prototype.hasOwnProperty.call(o,LEGACY_CLUB_NAME)){const v=o[LEGACY_CLUB_NAME];o[CURRENT_CLUB_NAME]=k==='badges'&&v==='arsenal'?'Al-Ahli':v;delete o[LEGACY_CLUB_NAME];changed=true}})}
 st.matches.forEach(m=>['opp','gopp','tr'].forEach(k=>{if(m[k]===LEGACY_CLUB_NAME){m[k]=CURRENT_CLUB_NAME;changed=true}}));if(changed)save()}
migrateClubName();function normB(){if(!(Array.isArray(st.bench)&&st.bench.length&&new Set(st.bench).size==st.bench.length&&st.bench.every(i=>P.some(p=>p.id==i))))st.bench=[6,7]}function slotOf(p){st.slot=st.slot||{};return st.slot[p.id]||(st.bench.includes(p.id)?'BENCH':p.pos)}function syncBench(){st.bench=P.filter(p=>slotOf(p)=='BENCH').map(p=>p.id)}function syncSlots(){st.slot=st.slot||{};P.forEach(p=>{if(!st.slot[p.id])st.slot[p.id]=st.bench.includes(p.id)?'BENCH':p.pos});syncBench()}normB();syncSlots();
try{const t=localStorage.getItem(TK);if(t)document.documentElement.dataset.theme=t}catch(e){}
let remoteReady=false, applyingRemote=false;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}
  if(window.sharedDb && remoteReady && !applyingRemote){
    window.sharedDb.collection('shared').doc('state').set({state:st,updatedAt:firebase.firestore.FieldValue.serverTimestamp()})
      .catch(e=>console.warn('Firebase save failed',e));
  }
}
window.sharedDb.collection('shared').doc('state').onSnapshot(doc=>{
  if(doc.exists && doc.data().state){
    applyingRemote=true;
    try{st=doc.data().state; if(!st||!Array.isArray(st.matches))st={matches:[],cap:null}; st.nums=st.nums||{}; st.tour=st.tour||null; normB(); syncSlots();
      try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}
      remoteReady=true; render();
    }finally{applyingRemote=false}
  }else{remoteReady=true; save();}
},e=>{console.warn('Firebase read failed',e); remoteReady=true});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pl=e=>e&&e.p?1:0;
const mpt=(p,e,ga)=>pl(e)?1+e.g*G[p.pos]+e.a*3+(ga==0?CS[p.pos]:0)+e.mt*3-e.y-3*e.r:0;
const mt=m=>P.reduce((t,p)=>t+mpt(p,m.ev&&m.ev[p.id],m.ga)*(st.cap==p.id?2:1),0);
const total=()=>st.matches.reduce((t,m)=>t+mt(m),0);
function S(id){const p=P.find(x=>x.id==id),r={app:0,g:0,a:0,cs:0,y:0,r:0,mt:0,pts:0};
 st.matches.forEach(m=>{const e=m.ev&&m.ev[id];if(!e||!e.p)return;r.app++;r.g+=e.g;r.a+=e.a;r.y+=e.y;r.r+=e.r;r.mt+=e.mt;if(m.ga==0)r.cs++;r.pts+=mpt(p,e,m.ga)});return r}
function rec(){let w=0,d=0,l=0,g=0,c=0;st.matches.forEach(m=>{g+=m.gf;if(m.ga==0)c++;m.gf>m.ga?w++:m.gf==m.ga?d++:l++});return{w,d,l,g,c}}
const rc=m=>m.gf>m.ga?['ف','var(--ok)']:m.gf==m.ga?['ت','#7d8aa6']:['خ','var(--bad)'];
const rk=()=>P.map(p=>({p,s:S(p.id)})).sort((a,b)=>b.s.pts-a.s.pts);
const isDk=()=>{const t=document.documentElement.dataset.theme;return t?t=='dark':matchMedia('(prefers-color-scheme:dark)').matches};
function theme(){const t=isDk()?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem(TK,t)}catch(e){}render()}
function toast(m){$('tst').textContent=m;$('tst').classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>$('tst').classList.remove('on'),2300)}
function shut(){$('ov').classList.remove('on')}
function ask(msg,fn){$('box').innerHTML=`<h2>${msg}</h2><div class="g2"><button class="btn" id="yes">نعم</button><button class="btn sec2" onclick="shut()">إلغاء</button></div>`;$('ov').classList.add('on');$('yes').onclick=()=>{shut();fn()}}
$('ov').onclick=e=>{if(e.target==$('ov'))shut()};
async function copy(el){el.select();let ok=0;try{await navigator.clipboard.writeText(el.value);ok=1}catch(e){try{ok=document.execCommand('copy')}catch(_){}}toast(ok?'تم النسخ':'حدّد النص وانسخه يدويًا')}
function cnt(){if(liteMode)return;document.querySelectorAll('[data-n]').forEach(el=>{const n=+el.dataset.n,t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/800);el.textContent=Math.round(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)})}
function boom(){if(liteMode)return;const c=$('cv'),x=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight,cl=['#ef0107','#fff','#c8a24a','#063672','#ff6a6f'];
 const a=Array.from({length:120},()=>({x:W/2,y:H*.4,vx:(Math.random()-.5)*15,vy:-Math.random()*14-3,s:6+Math.random()*6,c:cl[Math.random()*5|0],r:Math.random()*6,vr:(Math.random()-.5)*.4}));
 let t=0;(function f(){x.clearRect(0,0,W,H);a.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++t<150)requestAnimationFrame(f);else x.clearRect(0,0,W,H)})()}
function bars(a){const mx=Math.max(1,...a.map(x=>Math.abs(x.v)));return `<div class="bars">${a.map(x=>`<div class="bc"><span>${x.v}</span><i style="height:${Math.max(4,Math.abs(x.v)/mx*70)}px${x.v<0?';background:var(--bad)':''}"></i><small>${x.l}</small></div>`).join('')}</div>`}
function head(){const r=rec(),ms=[...st.matches].reverse().slice(0,5),cp=st.cap&&P.find(p=>p.id==st.cap),n=(v,t)=>`<div><b data-n="${v}">${v}</b><small>${t}</small></div>`;
 $('hd').innerHTML=`<div class="sb"><div class="sbt"><div class="sbn"><small>نقاط الفريق</small><b data-n="${total()}">${total()}</b></div><div class="sbr">${n(st.matches.length,'مباراة')}<div><b>${r.w}-${r.d}-${r.l}</b><small>ف-ت-خ</small></div>${n(r.g,'هدف')}${n(r.c,'شباك نظيفة')}</div></div><div class="sbf"><span class="form">${ms.map(m=>{const c=rc(m);return `<span class="dot" style="background:${c[1]}">${c[0]}</span>`}).join('')}</span><span>${cp?'الكابتن '+cp.n+' نقاطه ×2':'اختر كابتن لمضاعفة نقاطه'}</span></div></div>`}
function chip(p){const s=S(p.id),lm=st.matches[st.matches.length-1],star=lm&&lm.ev&&lm.ev[p.id]&&lm.ev[p.id].mt;
 return `<button class="pl ${p.pos.toLowerCase()}" draggable="true" data-player="${p.id}" style="animation-delay:${p.id*70}ms" ondragstart="dragPlayer(event,${p.id})" onclick="openP(${p.id})">${PIC[p.id]?`<img class="av" alt="" loading="lazy" decoding="async" src="${PIC[p.id].a}">`:''}<span class="kit">${nu(p)}</span><b>${p.n}</b><i>${s.pts} نقطة</i>${st.cap==p.id?'<u>C</u>':''}${star?'<em>⭐</em>':''}</button>`}
function mrow(m){const c=rc(m);return `<div class="m"><span class="r" style="background:${c[1]}">${c[0]}</span><span class="t">${m.home?'ضد':'خارج'} ${esc(m.opp)}<small>الجولة ${m.round}${m.tr?' (تصفيات: '+esc(m.tr)+')':''} وجمع الفريق ${mt(m)} نقطة</small></span><span class="sc">${m.gf} - ${m.ga}</span><button onclick="delM(${m.id})" aria-label="حذف المباراة">🗑</button></div>`}
function teamV(){const row=k=>{const a=P.filter(p=>slotOf(p)==k);return `<div class="row dropzone" data-slot="${k}" ondragover="allowPlayerDrop(event)" ondrop="dropPlayer(event,'${k}')">${a.map(chip).join('')||'<span class="drop-hint">اسحب لاعبًا هنا</span>'}</div>`},has=st.matches.length;
 return `<div class="pitch"><i class="l h"></i><i class="l c"></i><i class="l b1"></i><i class="l b2"></i>${row('FWD')}${row('MID')}${row('DEF')}${row('GK')}</div>
 <div class="bench dropzone" data-slot="BENCH" ondragover="allowPlayerDrop(event)" ondrop="dropPlayer(event,'BENCH')"><h3>الدكة — اسحب أي لاعب إلى هنا</h3><div class="row">${P.filter(p=>slotOf(p)=='BENCH').map(chip).join('')||'<span class="drop-hint">الدكة فارغة</span>'}</div></div>
 <p class="hint">اضغط على لاعب لرؤية إحصائياته أو تعيينه كابتن (نقاطه ×2)</p>
 ${has?`<div class="sec"><h3>نقاط الفريق في كل مباراة</h3>${bars(st.matches.slice(-12).map(m=>({v:mt(m),l:'ج'+m.round})))}</div>`:''}
 <div class="sec"><h3>المباريات</h3>${has?[...st.matches].reverse().map(mrow).join(''):'<div class="empty">لا توجد مباريات بعد. سجّل أول مباراة لتبدأ النقاط.<button class="btn" onclick="go(\'match\')">تسجيل مباراة</button></div>'}</div>
 <details class="sec"><summary>نظام النقاط</summary><div class="rules"><span>🏃 مشاركة +1</span><span>⚽ هدف حارس/مدافع +6</span><span>⚽ وسط +5</span><span>⚽ مهاجم +4</span><span>🅰️ تمريرة حاسمة +3</span><span>🧤 شباك نظيفة حارس/مدافع +4</span><span>🧤 وسط +1</span><span>⭐ أفضل لاعب +3</span><span>🟨 −1</span><span>🟥 −3</span><span>C الكابتن ×2</span></div></details>`}
function newF(){F={};P.forEach(p=>F[p.id]={p:1,g:0,a:0,y:0,r:0,mt:0});D={opp:'',gopp:'',gf:0,ga:0,home:1,rd:'',tr:0,pk:0}}
const stp=(id,k,ic)=>`<div class="stp"><button onclick="bump(${id},'${k}',-1)" aria-label="إنقاص">−</button><span>${ic} ${F[id][k]}</span><button onclick="bump(${id},'${k}',1)" aria-label="زيادة">+</button></div>`;
function drawPl(){let t=0;
 $('pls').innerHTML=P.map(p=>{const e=F[p.id],on=pl(e),v=mpt(p,e,D.ga);t+=v*(st.cap==p.id?2:1);
  return `<div class="pr${on?'':' off'}"><div class="ph"><b>${p.n}<small>${PL[p.pos]}</small></b><span class="pv">${on?(v>0?'+':'')+v:'—'}</span><button class="sw${on?' on':''}" onclick="tg(${p.id},'p')">${on?'لعب ✓':'لم يلعب'}</button></div>${on?`<div class="tg">${stp(p.id,'g','⚽')}${stp(p.id,'a','🅰️')}<button class="chip${e.y?' on':''}" onclick="tg(${p.id},'y')">🟨</button><button class="chip${e.r?' on':''}" onclick="tg(${p.id},'r')">🟥</button><button class="chip${e.mt?' on':''}" onclick="tg(${p.id},'mt')">⭐ الأفضل</button></div>`:''}</div>`}).join('');
 $('tp').textContent=t}
function tg(id,k){const e=F[id];
 if(k=='p'){e.p=e.p?0:1;if(!e.p)Object.assign(e,{g:0,a:0,y:0,r:0,mt:0})}
 else{e[k]=e[k]?0:1;if(k=='mt'&&e.mt)P.forEach(q=>{if(q.id!=id)F[q.id].mt=0})}
 drawPl()}
function bump(id,k,d){const e=F[id];e[k]=Math.max(0,e[k]+d);if(k=='g'){const s=P.reduce((t,p)=>t+F[p.id].g,0);if(D.gf<s){D.gf=s;$('gf').value=s}}drawPl()}
function sc(){D.gf=+$('gf').value||0;D.ga=+$('ga').value||0;drawPl()}
function matchV(){return `<div class="sec"><h3>تسجيل مباراة</h3>
 <div class="g2"><div><label>الجولة</label><input type="number" min="1" value="${D.rd||st.matches.length+1}" oninput="D.rd=this.value"></div><div><label>الملعب</label><select onchange="D.home=this.value"><option value="1"${D.home==1?' selected':''}>ملعبنا</option><option value="0"${D.home==0?' selected':''}>خارج</option></select></div></div>
 <label>الفريق الخصم</label><input value="${esc(D.opp)}" placeholder="اسم الفريق" oninput="D.opp=this.value">${tourLive()?`<label>نوع المباراة</label><select onchange='D.tr=+this.value;this.nextElementSibling.hidden=!D.tr'><option value='0'${D.tr?'':' selected'}>عادية</option><option value='1'${D.tr?' selected':''}>تصفيات: ${tourSt().cur}</option></select><div${D.tr?'':' hidden'}><label>ركلات الترجيح إذا انتهت بالتعادل</label><select onchange='D.pk=+this.value'><option value='0'>لا يوجد</option><option value='1'${D.pk==1?' selected':''}>فزنا</option><option value='-1'${D.pk==-1?' selected':''}>خسرنا</option></select></div>`:''}
 <div class="g2"><div><label>أهداف الأهلي السعودي</label><input id="gf" type="number" min="0" value="${D.gf}" oninput="sc()"></div><div><label>أهداف الخصم</label><input id="ga" type="number" min="0" value="${D.ga}" oninput="sc()"></div></div>
 <div class="tot"><span>نقاط الفريق من هذه المباراة</span><b id="tp">0</b></div>
 <label>أداء اللاعبين</label><div id="pls"></div>
 <button class="btn" onclick="addM()">حفظ المباراة</button></div>`}
function addM(){const opp=D.opp.trim();if(!opp){toast('اكتب اسم الفريق الخصم قبل الحفظ');return}
 const ev={};P.forEach(p=>ev[p.id]={...F[p.id]});
 const T=tourLive(),m={id:Date.now(),round:+D.rd||st.matches.length+1,opp,home:D.home==1,gf:D.gf,ga:D.ga,ev};if(D.tr&&T){m.tr=tourSt().cur;m.tid=st.tour.id;m.pk=D.pk}
 st.matches.push(m);save();newF();tab='team';render();scrollTo(0,0);
 if(m.gf>m.ga){boom();toast('تم حفظ الفوز: '+mt(m)+' نقطة للفريق')}else toast('تم حفظ المباراة')}
function delM(id){ask('حذف هذه المباراة؟',()=>{st.matches=st.matches.filter(m=>m.id!=id);save();render();toast('تم حذف المباراة')})}
function rankV(){const l=rk();if(!st.matches.length)return `<div class="sec"><h3>الترتيب</h3><div class="empty">الترتيب يظهر بعد تسجيل أول مباراة.<button class="btn" onclick="go('match')">تسجيل مباراة</button></div></div>`;
 const mx=Math.max(1,l[0].s.pts),pc=(x,m,h)=>`<div class="pc" onclick="openP(${x.p.id})"><div class="md">${m}</div>${x.p.n}<div class="pb" style="height:${h}px">${x.s.pts}</div></div>`;
 const best=(k,t,ic)=>{const x=[...l].sort((a,b)=>b.s[k]-a.s[k])[0];return x&&x.s[k]>0?`<div class="stat"><b>${ic} ${x.p.n}</b><span>${t} (${x.s[k]})</span></div>`:''};

function groupData(){const t=st.tour;if(!t||t.phase!=='groups')return null;const gs=t.groups||[],manual=t.manualPts||{};return gs.map((names,gi)=>{const rows=names.map(n=>({n,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:Object.prototype.hasOwnProperty.call(manual,n)?Number(manual[n])||0:0,form:[]}));const played=st.matches.filter(m=>m.tid==t.id&&m.stage==='groups'&&m.gi==gi);played.forEach(m=>{const a=rows.find(r=>r.n==='الأهلي السعودي'),b=rows.find(r=>r.n===(m.gopp||m.opp));if(!a||!b)return;a.p++;b.p++;a.gf+=m.gf;a.ga+=m.ga;b.gf+=m.ga;b.ga+=m.gf;let ar,br;if(m.gf>m.ga){a.w++;b.l++;ar='W';br='L'}else if(m.gf<m.ga){b.w++;a.l++;ar='L';br='W'}else{a.d++;b.d++;ar='D';br='D'}a.form.push(ar);b.form.push(br);if(!Object.prototype.hasOwnProperty.call(manual,a.n)){if(ar==='W')a.pts+=3;else if(ar==='D')a.pts++}if(!Object.prototype.hasOwnProperty.call(manual,b.n)){if(br==='W')b.pts+=3;else if(br==='D')b.pts++}});rows.forEach(r=>{r.form=r.form.slice(-5)});rows.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);return{names,rows,played}})}

<script>
/* Group qualification and movable knockout bracket */
(function(){
  const originalTourV = tourV;
  const originalGroupStageV = groupStageV;
  const originalTourSt = tourSt;
  const originalIsTourLive = isTourLive;
  const originalBrk = brk;
  const originalPlayT = playT;
  const originalAddM = addM;
  const groupKoRoundNames = ['دور الـ32','دور الـ16','ربع النهائي','نصف النهائي','النهائي'];
  let arrangeMode = false;
  let draggedTeamIndex = null;
  let selectedTeamIndex = null;

  const safeAttr = value => String(value == null ? '' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const groupKoRecords = () => {
    const t = st.tour;
    return st.matches.filter(m => t && m.tid == t.id && m.stage === 'knockout' && Number.isInteger(m.koRound));
  };
  const canArrangeGroupKo = () => {
    const t = st.tour;
    return !!(t && t.groupKO && !groupKoRecords().length && !Object.keys(t.w || {}).length);
  };

  window.advanceGroups = function(force){
    const t = st.tour;
    if (!t || t.phase !== 'groups') return;
    if (!force && !groupsComplete()) { toast('أكمل مباريات الأهلي السعودي في المجموعة أولًا'); return; }
    const standings = groupData();
    const qualifiers = [];
    standings.forEach(group => group.rows.slice(0, 2).forEach(row => {
      if (!qualifiers.includes(row.n)) qualifiers.push(row.n);
    }));
    if (qualifiers.length < 2) { toast('لا يوجد عدد كافٍ من الفرق للتأهل'); return; }
    let size = 1;
    while (size < qualifiers.length) size *= 2;
    t.groupKO = true;
    t.phase = 'knockout';
    const byeCount = size - qualifiers.length;
    const slots = [];
    for (let i = 0; i < byeCount; i++) slots.push(qualifiers[i], null);
    for (let i = byeCount; i < qualifiers.length; i += 2) slots.push(qualifiers[i], qualifiers[i + 1] == null ? null : qualifiers[i + 1]);
    t.tm = slots;
    t.o = t.tm.indexOf('الأهلي السعودي');
    if (t.o < 0) { t.tm[0] = 'الأهلي السعودي'; t.o = 0; }
    t.s = groupKoRoundNames.length - Math.log2(size);
    t.w = {};
    t.koQualifiers = qualifiers.slice();
    save();
    arrangeMode = false;
    selectedTeamIndex = null;
    tab = 'tour';
    render();
    toast('بدأت التصفيات — تأهل أول فريقين من كل مجموعة');
  };
  window.finishGroupsNow = function(){
    if (!st.tour || st.tour.phase !== 'groups') return;
    ask('إنهاء المجموعات الآن وبدء التصفيات حسب الترتيب الحالي؟', () => advanceGroups(true));
  };

  window.brk = function(){
    const t = st.tour;
    if (!t || !t.groupKO) return originalBrk();
    const results = groupKoRecords();
    const cur = t.tm.map((name, i) => name == null ? null : i);
    const rounds = [];
    let entrants = cur;
    for (let k = 0; entrants.length > 1; k++) {
      const matches = [], next = [];
      for (let i = 0; i < entrants.length; i += 2) {
        const a = entrants[i], b = entrants[i + 1];
        const us = a != null && b != null && (a === t.o || b === t.o);
        let winner = null, rec = null;
        if (a == null && b != null) winner = b;
        else if (b == null && a != null) winner = a;
        else if (a != null && b != null && us) {
          rec = results.find(m => m.koRound === k) || null;
          if (rec) {
            if (rec.gf > rec.ga || (rec.gf === rec.ga && rec.pk === 1)) winner = t.o;
            else if (rec.gf < rec.ga || (rec.gf === rec.ga && rec.pk === -1)) winner = a === t.o ? b : a;
          }
        } else if (a != null && b != null) {
          const chosen = (t.w || {})[k + '-' + (i / 2)];
          if (chosen != null && (chosen === a || chosen === b)) winner = chosen;
        }
        matches.push({a, b, v: winner, us, m: rec});
        next.push(winner);
      }
      rounds.push(matches);
      entrants = next;
    }
    return rounds;
  };

  window.tourSt = function(){
    const t = st.tour;
    if (!t || !t.groupKO) return originalTourSt();
    const levels = brk();
    const rows = groupKoRoundNames.slice(t.s).map(name => ({n:name, m:null, s:'todo'}));
    let c = rows.length, out = 0, ch = 0, waiting = false;
    for (let k = 0; k < rows.length; k++) {
      const match = (levels[k] || []).find(m => m.us);
      if (!match) { waiting = k > 0; c = k; break; }
      if (match.a == null || match.b == null) {
        rows[k].s = 'win';
        continue;
      }
      const played = groupKoRecords().find(m => m.koRound === k);
      if (!played) { rows[k].s = 'cur'; c = k; break; }
      rows[k].m = played;
      if (played.gf > played.ga || (played.gf === played.ga && played.pk === 1)) rows[k].s = 'win';
      else if (played.gf < played.ga || (played.gf === played.ga && played.pk === -1)) { rows[k].s = 'out'; out = 1; c = k; break; }
      else { rows[k].s = 'draw'; c = k; break; }
    }
    if (!out && !waiting && rows.length && rows.every(r => r.s === 'win')) ch = 1;
    if (!out && !ch && !waiting && c < rows.length && rows[c].s === 'todo') rows[c].s = 'cur';
    return {rows, out, ch, c, cur: ch ? '' : out ? rows[c].n : rows[c] ? rows[c].n : '', waiting};
  };

  window.isTourLive = function(){
    const t = st.tour;
    if (t && t.groupKO) { const state = tourSt(); return !!state && !state.out && !state.ch; }
    return originalIsTourLive();
  };

  window.playT = function(){
    const t = st.tour;
    if (!t || !t.groupKO) return originalPlayT();
    const state = tourSt();
    const match = state && brk()[state.c] && brk()[state.c].find(m => m.us);
    if (!match || match.a == null || match.b == null) { toast('انتظر حسم المواجهات الأخرى في هذا الدور'); return; }
    D.tr = 1;
    D.stage = 'knockout';
    D.koRound = state.c;
    D.opp = t.tm[match.a === t.o ? match.b : match.a];
    go('match');
  };

  window.addM = function(){
    const t = st.tour;
    const wasGroups = !!(t && t.phase === 'groups');
    const round = t && t.groupKO ? D.koRound : null;
    originalAddM();
    if (t && t.groupKO) {
      const saved = st.matches[st.matches.length - 1];
      if (saved && saved.tid == t.id) { saved.koRound = round; save(); }
    } else if (wasGroups && st.tour === t && t.phase === 'groups' && groupsComplete()) {
      advanceGroups();
    }
  };

  window.koToggleArrange = function(){
    if (!canArrangeGroupKo()) { toast('لا يمكن تعديل القرعة بعد بدء المباريات'); return; }
    arrangeMode = !arrangeMode;
    selectedTeamIndex = null;
    render();
    toast(arrangeMode ? 'اختر فريقين لتبديل موقعيهما' : 'تم إيقاف وضع ترتيب القرعة');
  };
  window.koDragStart = function(event, index){
    if (!canArrangeGroupKo()) { event.preventDefault(); return; }
    draggedTeamIndex = index;
    if (event.dataTransfer) { event.dataTransfer.effectAllowed = 'move'; event.dataTransfer.setData('text/plain', String(index)); }
  };
  window.koDragEnd = function(){ draggedTeamIndex = null; };
  window.koDragOver = function(event){ if (canArrangeGroupKo()) { event.preventDefault(); event.currentTarget.classList.add('ko-hover'); } };
  window.koDrop = function(event, target){
    event.preventDefault();
    if (event.currentTarget) event.currentTarget.classList.remove('ko-hover');
    const source = draggedTeamIndex == null ? +(event.dataTransfer && event.dataTransfer.getData('text/plain')) : draggedTeamIndex;
    draggedTeamIndex = null;
    if (!Number.isInteger(source) || source === target) return;
    koSwap(source, target);
  };
  window.koSlotTap = function(index, round, game){
    if (arrangeMode && canArrangeGroupKo()) {
      if (selectedTeamIndex == null) { selectedTeamIndex = index; render(); toast('اختر الفريق الثاني للتبديل'); }
      else if (selectedTeamIndex === index) { selectedTeamIndex = null; render(); }
      else { const old = selectedTeamIndex; selectedTeamIndex = null; koSwap(old, index); }
      return;
    }
    slotD(round, game, index);
  };
  function koSwap(a, b){
    const t = st.tour;
    if (!canArrangeGroupKo() || a < 0 || b < 0 || a >= t.tm.length || b >= t.tm.length) return;
    [t.tm[a], t.tm[b]] = [t.tm[b], t.tm[a]];
    if (t.o === a) t.o = b; else if (t.o === b) t.o = a;
    t.w = {};
    selectedTeamIndex = null;
    save(); render(); toast('تم تبديل الفريقين في القرعة');
  }

  function groupKoBracket(){
    const t = st.tour, rounds = brk(), state = tourSt();
    const showSlot = (k, j, index, match) => {
      if (index == null) return `<span class="sl ko-empty"><b>إعفاء</b><small>تأهل تلقائي</small></span>`;
      const name = t.tm[index] == null ? '؟' : safeAttr(t.tm[index]);
      const hasScore = match.m && match.us;
      const score = hasScore ? `<i>${index === t.o ? match.m.gf : match.m.ga}</i>` : '';
      const draggable = k === 0 && canArrangeGroupKo() ? ` draggable="true" ondragstart="koDragStart(event,${index})" ondragend="koDragEnd()" ondragover="koDragOver(event)" ondrop="koDrop(event,${index})"` : '';
      const tap = k === 0 ? ` onclick="koSlotTap(${index},${k},${j})"` : ` onclick="slotD(${k},${j},${index})"`;
      const picked = selectedTeamIndex === index ? ' ko-picked' : '';
      return `<span class="sl${index === t.o?' me':''}${match.v != null && match.v === index?' wn':''}${match.v != null && index != null && match.v !== index?' lo':''}${picked}"${draggable}${tap}><b>${name}</b>${score}</span>`;
    };
    const champion = rounds.length ? rounds[rounds.length-1][0].v : null;
      return `<div class="ko-scroll"><div class="bkt" style="height:${Math.max(160,t.tm.length*40)}px">${rounds.map((games,k)=>`<div class="rd${k===rounds.length-1?' fin':''}" style="--j:${40*2**k}px"><h4 class="ko-round-label">${safeAttr(groupKoRoundNames[t.s+k] || 'الدور '+(k+1))}</h4>${games.map((m,j)=>`<div class="mt${m.us&&m.v==null?' now':''}${m.v!=null?' dn':''}">${showSlot(k,j,m.a,m)}${showSlot(k,j,m.b,m)}${!m.us&&m.a!=null&&m.b!=null&&m.v==null?`<button class="ko-winner" onclick="setW(${k},${j},${m.a})">فوز ${safeAttr(t.tm[m.a])}</button><button class="ko-winner" onclick="setW(${k},${j},${m.b})">فوز ${safeAttr(t.tm[m.b])}</button>`:''}</div>`).join('')}</div>`).join('')}<div class="rd end"><h4 class="ko-round-label">البطل</h4><div class="mt"><span class="sl cm${champion===t.o?' me':''}${champion!=null?' wn':''}"><b>${champion==null?'لم يُحسم بعد':'🏆 '+safeAttr(t.tm[champion])}</b></span></div></div></div></div>`;
  }

  function groupKoView(){
    const t = st.tour, state = tourSt(), ended = state.out || state.ch;
    const readyMatch = !ended && !state.waiting && brk()[state.c] && brk()[state.c].some(m => m.us && m.a != null && m.b != null);
    const arrangeButton = canArrangeGroupKo() ? `<button class="btn sec2" onclick="koToggleArrange()">${arrangeMode?'إيقاف ترتيب القرعة':'✥ ترتيب المواجهات يدويًا'}</button>` : '';
    const instruction = (canArrangeGroupKo() ? `<p class="hint">اسحب أي فريق إلى مواجهة أخرى، أو فعّل «ترتيب المواجهات» ثم اختر فريقين على الهاتف. الخانات الفارغة إعفاء تلقائي.</p>` : `<p class="hint">بدأت مباريات خروج المغلوب؛ ترتيب القرعة مقفل للحفاظ على النتائج.</p>`) + `<p class="hint">مرّر الجدول أفقيًا لمشاهدة الأدوار التالية.</p>`;
    const qualified = (t.koQualifiers || []).map(n => `<span class="ko-qualifier">${badgeImg(n)}${safeAttr(n)}</span>`).join('');
    const timeline = state.rows.map((r,i)=>`<div class="tn ${r.s}"><span class="nd">${r.s==='win'?'✓':r.s==='out'?'✕':i+1}</span><span class="t"><b>${safeAttr(r.n)}</b><small>${r.m?'ضد '+safeAttr(r.m.opp)+(r.s==='draw'?' (تعادل: تُعاد المباراة)':r.m.gf===r.m.ga?(r.m.pk>0?' (فزنا بالترجيح)':' (خسرنا بالترجيح)'):''):'لم تُلعب بعد'}</small></span>${r.m?`<span class="sc">${r.m.gf} - ${r.m.ga}</span>`:''}</div>`).join('');
    return `<div class="tb ${state.ch?'ch':state.out?'xx':''}"><span class="ic">${state.ch?'🏆':state.out?'💔':'🏆'}</span><h2>${safeAttr(t.name)}</h2><p>${state.ch?'أبطال البطولة':state.out?'خرجنا من '+safeAttr(state.cur):state.waiting?'في انتظار اكتمال مواجهات الدور':'الدور الحالي: '+safeAttr(state.cur)}</p></div><div class="sec"><h3>المتأهلون — أول فريقين من كل مجموعة</h3><div class="ko-qualifiers">${qualified}</div></div><div class="sec"><h3>قرعة الأدوار الإقصائية</h3>${instruction}${arrangeButton}${groupKoBracket()}${readyMatch?`<button class="btn" onclick="playT()">سجّل مباراة ${safeAttr(state.cur)}</button>`:''}${state.waiting&&!ended?`<p class="hint">اختر الفائز في المباريات الأخرى المعروضة في الجدول حتى تتحدد مواجهتنا التالية.</p>`:''}</div><div class="sec"><h3>مسار الأهلي السعودي</h3><div class="tl">${timeline}</div><button class="btn sec2" onclick="resetT()">${ended?'ابدأ بطولة جديدة':'إنهاء البطولة'}</button></div>`;
  }

  window.tourV = function(){
    if (st.tour && st.tour.groupKO) return groupKoView();
    if (st.tour && st.tour.phase === 'groups' && groupsComplete()) { advanceGroups(); return groupKoView(); }
    return originalTourV();
  };
  window.groupStageV = function(){
    return originalGroupStageV().replace(
      '<button class="btn" onclick="addGroup()">＋ إضافة مجموعة جديدة</button>',
      '<button class="btn" onclick="addGroup()">＋ إضافة مجموعة جديدة</button><button class="btn sec2" onclick="finishGroupsNow()">إنهاء المجموعات الآن وبدء التصفيات</button><p class="hint">عند الإنهاء المبكر، يتأهل أول فريقين حسب ترتيب المجموعات الحالي.</p>'
    );
  };

  const css = document.createElement('style');
  css.textContent = `.ko-qualifiers{display:flex;flex-wrap:wrap;gap:7px}.ko-qualifier{display:inline-flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:5px 9px;font-size:12px}.ko-qualifier img{width:19px;height:19px;object-fit:contain}.ko-scroll{overflow-x:auto;overflow-y:hidden;padding:30px 8px 18px;margin:0 -6px;scrollbar-width:thin;scrollbar-color:var(--red) var(--bg2);overscroll-behavior-x:contain}.ko-round-label{position:absolute;top:-23px;right:0;white-space:nowrap;font-size:11px;color:var(--mut);margin:0}.ko-scroll .bkt{width:max-content;min-width:max-content;margin:0;direction:rtl}.ko-scroll .rd{position:relative;flex:0 0 132px;min-width:132px;padding-top:28px;justify-content:space-around}.ko-scroll .rd.end{flex:0 0 110px;min-width:110px}.ko-scroll .mt{position:relative;width:118px;margin-inline-end:10px;touch-action:pan-y}.ko-scroll .rd.end .mt{width:100px}.ko-scroll .sl{font-size:12px;height:32px;padding:0 8px}.ko-scroll .ko-round-label{top:0;right:8px}.ko-scroll .sl[draggable=true]{cursor:grab}.ko-scroll .sl[draggable=true]:active{cursor:grabbing}.ko-hover{outline:2px dashed var(--gold);outline-offset:2px}.ko-picked{outline:3px solid var(--gold)!important;outline-offset:2px}.ko-empty{opacity:.72;display:flex;flex-direction:column}.ko-empty small{font-size:10px}.ko-winner{font:inherit;font-size:10px;background:var(--bg2);color:var(--tx);border:1px solid var(--line);border-radius:7px;padding:3px;margin:2px;cursor:pointer}`;
  document.head.appendChild(css);
  render();
})();

</script>
</body>
</html>
